# uio_pdrv_genirq matches only the compatible string given here, and only if it is a
# module parameter: the built-in driver would need the same string on the kernel
# command line.  Our pages' DT node is `compatible = "generic-uio"`.
# uio_pdrv_genirq 只按这里给出的 compatible 匹配，而且只有模块参数这一条路（内置驱动
# 只能靠内核 cmdline）。两个页的节点写的是 compatible = "generic-uio"。
options uio_pdrv_genirq of_id=generic-uio
