# 让厂商的 `load-systemko` 变成空操作 / Make the vendor's `load-systemko` a no-op.
#
# 它在开机阶段放**厂商**固件；我们的 `guidance-core.timer`（+20 秒、带守卫）要放的是
# 我们自己的 DW-tick 固件。两者叠加就是"一次开机两次放核"，实测会让启动走不到多用户。
# 清空 `ExecStart` 再给一个 `true`，单元仍然"存在且可 enable"（镜像的 image-customize
# 会 `systemctl enable load-systemko`，mask 到 /dev/null 会让那一步直接失败），但不再
# 有任何放核动作。
# It releases the *vendor* firmware during boot while our guarded `guidance-core.timer`
# (+20 s) releases ours.  Both together is two releases per boot, which measured as a boot
# that never reached multi-user.  Clearing `ExecStart` and replacing it with `true` keeps the
# unit present and enable-able (the image's image-customize runs `systemctl enable
# load-systemko`; masking to /dev/null makes that step fail) while removing the release.
[Service]
ExecStart=
ExecStart=/bin/true
