# 关掉镜像的首次开机扩容 / Turn off the image's first-boot growth.
#
# 这颗 5.10 内核的在线 ext4 扩容会 oops：实测 `resize2fs` 崩在
# `ext4_flex_group_add -> ext4_resize_fs`，`fallocate` 崩在 `ext4_mb_find_by_goal`。
# 镜像的根分区已经是固定 4 GB，够录制约 3 GB，所以这里把整套扩容/swapfile 步骤清掉，
# 只保留不需要块分配的两步（硬件随机数种子、重生成 SSH 主机密钥）。
# Online ext4 growth oopses this 5.10 kernel: `resize2fs` dies in
# `ext4_flex_group_add -> ext4_resize_fs` and `fallocate` in `ext4_mb_find_by_goal`.
# The image's root filesystem is a fixed 4 GB, enough for about 3 GB of recording, so the
# whole grow/swapfile sequence is cleared here; only the two steps that allocate no blocks
# stay (hardware RNG seed, SSH host key regeneration).
[Service]
ExecStartPre=
ExecStartPre=-/bin/sh -c "if [ -e /dev/hwrng ]; then dd if=/dev/hwrng of=/dev/urandom count=1 bs=4096; fi"
ExecStartPre=-/bin/sh -c "/bin/rm -f -v /etc/ssh/ssh_host_*_key*"
# swapfile 保留（256 MB 内存跑相机 + 推流时需要余量），但用 `dd` 写：`fallocate` 在这颗
# 内核上会 oops（见下面镜像 cfg 的说明）。写路径安全，所以只保留这一条块分配动作。
# Keep the swapfile (256 MB of RAM running the camera and the stream wants headroom) but
# write it with `dd`: `fallocate` oopses this kernel.  The write path is safe, so this is
# the only block-allocating step left.
# swapfile 暂时不建：256 MB 的 `dd` 会在首次开机时产生一大段 SD 写，和 +20 秒的放核叠在
# 一起（实测日志正好停在放核那一刻）。先在无 swap 的情况下验证放核是否稳定，再决定要不要
# 以更晚的时机补回来。
# No swapfile for now: the 256 MB `dd` produces a long SD write during first boot and lands
# on top of the +20 s core release (measured: the console stops exactly at the release).
# Verify that the release is stable without swap first, then decide whether to bring it back
# with a later window.
