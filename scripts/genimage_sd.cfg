image sdcard.img {
    hdimage {
        partition-table-type="mbr"
    }
    partition boot {
        partition-type = 0x0b
        bootable = true
        image = "boot.vfat"
    }
    partition root {
        partition-type = 0x83
        image = "root.ext4"
    }
}
image boot.vfat {
    vfat {
        label="boot"
    }
    mountpoint = "/boot"
    size = 100M
}
image root.ext4 {
    ext4 {
        label="root"
        use-mke2fs=true
        /* 只允许 5.10 内核认识的特性：e2fsprogs 1.47 默认会打开 orphan_file（incompat
         * 0x1000，Linux 5.15 才支持），5.10 的 ext4 会以“未知 incompat 特性”拒绝挂载
         * 根分区——表现就是上电即卡死、没有任何 USB/串口输出。^huge_file 是 genimage
         * 原本就关掉的那个；^metadata_csum_seed 一并关掉，与 1.47 之前的默认对齐。
         * Keep only features the 5.10 kernel knows: e2fsprogs 1.47 enables orphan_file by
         * default (incompat 0x1000, Linux 5.15+), and 5.10's ext4 refuses to mount a root
         * filesystem carrying it -- which looks like a dead board with no console output. */
        features = "^huge_file,^orphan_file,^metadata_csum_seed"
    }
    mountpoint = "/"
    /* 固定 4 GB，**不在板子上扩容**：这颗 5.10 内核的在线扩容会 oops
     * （实测 `resize2fs` 走 `ext4_flex_group_add -> ext4_resize_fs` 直接崩，
     * `fallocate` 走 `ext4_mb_find_by_goal` 也崩）。预留的空间够录制约 3 GB。
     * Fixed 4 GB, **no on-board growth**: this 5.10 kernel oopses in online ext4 resize
     * (measured: `resize2fs` crashes in `ext4_flex_group_add`, `fallocate` in
     * `ext4_mb_find_by_goal`).  The spare space leaves room for about 3 GB of recording. */
    size = 4G
}

